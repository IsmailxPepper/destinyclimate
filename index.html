<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DesTinY Climate™</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="background-overlay"></div>

<header class="navbar">

    <div class="logo">
        ✦ DesTinY Climate™
    </div>

    <div class="nav-actions">
        <button id="locationBtn">
            📍 My Location
        </button>
    </div>

</header>

<main>

<section class="hero">

    <div class="hero-content">

        <h1 id="cityName">
            Mumbai
        </h1>

        <div class="temperature">
            29°
        </div>

        <div class="condition">
            Mostly Cloudy
        </div>

        <div class="high-low">
            H:32° &nbsp; L:26°
        </div>

    </div>

</section>

<section class="search-section">

    <div class="glass-card">

        <input
            type="text"
            id="citySearch"
            placeholder="Search any city worldwide..."
        >

        <button id="searchBtn">
            Search
        </button>

    </div>

</section>

<section class="hourly-section">

    <h2>Hourly Forecast</h2>

    <div class="forecast-scroll" id="hourlyForecast">

    </div>

</section>

<section class="daily-section">

    <h2>10-Day Forecast</h2>

    <div class="glass-card">

        <div id="dailyForecast">
            
        </div>

        <div id="dailyForecast"></div>
    </div>

</section>

<section class="highlights-section">

    <h2>Today's Highlights</h2>

    <div class="highlights-grid">

        <div class="glass-card stat-card">
            <h3>Air Quality</h3>
            <p id="aqiValue">--</p>
        </div>

        <div class="glass-card stat-card">
            <h3>UV Index</h3>
            <p id="uvValue">--</p>
        </div>

        <div class="glass-card stat-card">
            <h3>Humidity</h3>
            <p id="humidityValue">--</p>
        </div>

        <div class="glass-card stat-card">
            <h3>Wind</h3>
            <p id="windValue">--</p>
        </div>

        <div class="glass-card stat-card">
            <h3>Sunrise</h3>
            <p id="sunriseValue">--</p>
        </div>

        <div class="glass-card stat-card">
            <h3>Sunset</h3>
            <p id="sunsetValue">--</p>
        </div>

    </div>

</section>

<section class="favorites-section">

    <h2>Favorite Cities</h2>

    <div class="cities-grid" id="favoritesContainer">

    </div>

</section>

<section class="global-section">

    <h2>Global Weather</h2>

    <div class="cities-grid" id="globalCities">

    </div>

</section>

</main>

<footer>

    <p>
        ✦ DesTinY Climate™
    </p>

    <p>
        Intelligent Weather. Beautifully Delivered.
    </p>

</footer>

<script src="js/storage.js"></script>
<script src="js/location.js"></script>
<script src="js/weather.js"></script>
<script src="js/forecast.js"></script>
<script src="js/favorites.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
